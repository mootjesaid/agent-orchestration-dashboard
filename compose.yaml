services:
    www:
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports:
            - '127.0.0.1:8000:8000'
            - '127.0.0.1:5173:5173'
        volumes:
            - .:/app
            - node_modules:/app/node_modules
            - vendor:/app/vendor
        environment:
            XDEBUG_MODE: 'off'
volumes:
    node_modules:
    vendor:
